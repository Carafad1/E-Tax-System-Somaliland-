services:
  - type: web
    name: etax-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "FLASK_SKIP_DB_INIT=1 flask db upgrade && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA_PATH
        value: certs/aiven-ca.pem
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Set in the Render dashboard at deploy time - never committed. The
      # seeder creates the admin account with whatever value is supplied
      # here, so a checked-in default would ship a known production password.
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_ENV
        value: production
